<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frazer OS</title>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cloudflare.com">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: 'Segoe UI', Arial, sans-serif;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:url("https://wallpaperhub.app") center/cover no-repeat;
  background-size:cover;
}

/* TASKBAR */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:55px;
  background:rgba(32, 32, 32, 0.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.start-btn{
  width:44px;
  height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#0078d4;
  cursor:pointer;
  font-size:20px;
  border-radius:8px;
  transition:0.2s;
}

.start-btn:hover{
  background:rgba(255,255,255,0.1);
}

/* WINDOWS 11 STYLE START MENU */
#start-menu{
  position:fixed;
  bottom:65px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  width:min(92vw, 560px);
  max-height:min(85vh, 600px);
  background:rgba(28, 28, 28, 0.82);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius:12px;
  padding:24px;
  display:none;
  color:white;
  opacity:0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index:9998;
  box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  overflow-y:auto;
}

#start-menu.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.search{
  width:100%;
  padding:10px 14px;
  border-radius:8px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  outline:none;
  background:rgba(45, 45, 45, 0.7);
  color:white;
  margin-bottom:20px;
  font-size:14px;
  border-bottom: 2px solid #0078d4;
}

.section-label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
  color: rgba(255,255,255,0.9);
}

/* MAIN GRID LAYOUT */
.main-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:16px;
}

/* WINDOWS FOLDER SYSTEM */
.folder-tile{
  background: transparent;
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.folder-tile:hover{
  background: rgba(255, 255, 255, 0.06);
}

.folder-icon-wrapper {
  position: relative;
  width: 48px;
  height: 48px;
}

.folder-icon {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.folder-label {
  font-size: 12px;
  color: #e2e2e2;
  font-weight: 400;
}

/* DROPDOWN EXPANDABLE SUB-GRIDS */
.folder-contents {
  grid-column: span 4;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.04);
  padding: 14px;
  display: none;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: -4px;
}

.folder-contents.open {
  display: grid;
}

/* APP & GAME ITEMS */
.app-item {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.02);
  border-radius: 6px;
  padding: 10px 8px;
  text-align: center;
  font-size: 12px;
  color: #f0f0f0;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.app-item:hover {
  background: rgba(255, 255, 255, 0.12);
  transform: translateY(-1px);
}

/* SETTINGS INDEPENDENT BUTTON */
.settings-tile {
  background: transparent;
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.settings-tile:hover {
  background: rgba(255, 255, 255, 0.06);
}
.settings-tile i {
  font-size: 34px;
  color: #0078d4;
  height: 48px;
  display: flex;
  align-items: center;
}

/* WINDOW AREA */
#window-area{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* WINDOWS */
.window{
  position:absolute;
  width:min(90vw, 850px);
  height:min(80vh, 520px);
  background:#1c1c1c;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  pointer-events:auto;
  display:flex;
  flex-direction:column;
  resize:both;
  min-width:280px;
  min-height:200px;
}

.window-header{
  height:40px;
  flex-shrink:0;
  background:rgba(255,255,255,0.04);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  cursor:move;
  color:white;
  user-select:none;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.win-controls{
  display:flex;
  gap:8px;
}

.win-btn{
  width:12px;
  height:12px;
  border-radius:50%;
  cursor:pointer;
}

.close{ background:#ff5f57; }
.max{ background:#ffbd2e; }

.window.maximized{
  top:0 !important;
  left:0 !important;
  width:100% !important;
  height:calc(100% - 55px) !important;
  border-radius:0 !important;
}

.window iframe{
  flex:1;
  width:100%;
  border:none;
  display:block;
  background:white;
}

@media (max-width:700px){
  #start-menu{
    width:96vw;
    bottom:60px;
    padding:16px;
  }
  .main-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .folder-contents {
    grid-column: span 3;
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div id="window-area"></div>

  <input class="search" placeholder="Search apps, games, settings...">
  
  <div class="section-label">Pinned Folders</div>

    <div class="folder-tile" onclick="toggleFolder('games-folder')">

        <svg viewBox="0 0 100 100" class="folder-icon">

          <path d="M10,20 L40,20 L45,26 L10,26 Z" fill="#FF9800"/>
          <rect x="10" y="32" width="80" height="53" fill="#FFCA28"/>

    <!-- APPS FOLDER CONTAINER OVERLAY DROP DOWN -->
    <div id="apps-folder" class="folder-contents">
