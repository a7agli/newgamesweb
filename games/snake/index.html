<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Google Snake Replica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;touch-action:none}
body{background:#4a752c;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#game-wrapper{position:relative;box-shadow:0 20px 40px rgba(0,0,0,.4);border-radius:10px;overflow:hidden;background:#578a34;max-width:95vw}
#top-banner{background:#4a752c;height:65px;display:flex;align-items:center;justify-content:space-around;padding:0 20px;border-bottom:4px solid #3d6124}
.stat-indicator{display:flex;align-items:center;gap:12px;font-size:1.6rem;font-weight:700;color:white}
#canvas-container{position:relative;width:600px;height:420px;max-width:100%}
canvas{display:block;background:#a2d149;width:100%;height:100%}
.overlay-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:center;z-index:10;transition:opacity .2s ease}
.overlay-screen.hidden{opacity:0;pointer-events:none}
.menu-card{background:#4d732c;border:8px solid #5c8a35;border-radius:18px;padding:25px 40px;width:420px;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);color:white;display:flex;flex-direction:column;align-items:center}
.menu-title{font-size:2.2rem;font-weight:800;margin-bottom:20px;color:#fff;text-shadow:2px 2px 0 #34511e}
.settings-box{width:100%;background:#3e5c23;border-radius:10px;padding:15px;margin-bottom:20px;border:2px solid #5c8a35}
.setting-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:1rem;font-weight:600}
.setting-item:last-child{margin-bottom:0}.setting-item label{color:#e3ffe3}
.setting-item select,.setting-item input[type=range]{background:#5c8a35;border:2px solid #71aa41;color:white;padding:5px 10px;border-radius:6px;font-weight:700;outline:none;cursor:pointer;width:150px}
.setting-item input[type=checkbox]{width:22px;height:22px;accent-color:#a2d149;cursor:pointer}
.primary-btn{background:#1e88e5;color:white;border:none;border-bottom:4px solid #1565c0;padding:12px 40px;font-size:1.4rem;font-weight:bold;border-radius:30px;cursor:pointer;transition:transform .1s,background-color .2s;box-shadow:0 4px 10px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px}
.primary-btn:hover{background:#2196f3}.primary-btn:active{transform:scale(.97);border-bottom-width:2px;margin-top:2px}
@media(max-width:650px){#canvas-container{height:min(70vw,420px);width:95vw}.menu-card{padding:20px}}
</style>
</head>
<body>
<div id="game-wrapper">
<div id="top-banner">
<div class="stat-indicator"><svg width="30" height="30" viewBox="0 0 24 24" fill="#e53935"><path d="M12 2C11.38 2 10.19 2.62 9.13 3.5C7.26 5.09 6.5 7.55 6.5 10c0 4.14 3.08 7.5 7 7.5s7-3.36 7-7.5c0-2.45-.76-4.91-2.63-6.5C16.81 2.62 15.62 2 15 2c-.62 0-1.5.5-3 1.5C10.5 2.5 9.62 2 12 2zm1 14.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-1.38-1.12-2.5-2.5-2.5-.28 0-.5-.22-.5-.5s.22-.5.5-.5c1.93 0 3.5 1.57 3.5 3.5z"/><path d="M12 2c.5 0 1 .5 1 1v1c0 .5-.5 1-1 1s-1-.5-1-1V3c0-.5.5-1 1-1z" fill="#7cb342"/></svg><span id="score-val">0</span></div>
<div class="stat-indicator"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fdd835"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v3c0 2.44 1.72 4.44 4 4.88V18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2v-3.12c2.28-.44 4-2.44 4-4.88V7c0-1.1-.9-2-2-2zm-12 5H5V7h2v3zm12 0h-2V7h2v3z"/></svg><span id="highscore-val">0</span></div>
</div>
<div id="canvas-container">
<canvas id="snakeCanvas" width="600" height="420"></canvas>
<div id="menu-screen" class="overlay-screen"><div class="menu-card">
<div id="panel-title" class="menu-title">Snake Game</div>
<div class="settings-box">
<div class="setting-item"><label for="grid-select">Map Density</label><select id="grid-select"><option value="30">Big Grid (14x20)</option><option value="25" selected>Normal Grid (15x24)</option><option value="15">Small Grid (28x40)</option></select></div>
<div class="setting-item"><label for="speed-range">Snake Speed</label><input type="range" id="speed-range" min="0.07" max="0.25" step="0.03" value="0.13"></div>
<div class="setting-item"><label for="wrap-checkbox">Wall Wrap-around</label><input type="checkbox" id="wrap-checkbox"></div>
</div>
<button id="action-btn" class="primary-btn" type="button"><span id="action-text">PLAY</span></button>
</div></div>
</div></div>
<script>
const canvas=document.getElementById('snakeCanvas');
const ctx=canvas.getContext('2d');
const scoreVal=document.getElementById('score-val');
const highscoreVal=document.getElementById('highscore-val');
const menuScreen=document.getElementById('menu-screen');
const panelTitle=document.getElementById('panel-title');
const actionBtn=document.getElementById('action-btn');
const actionText=document.getElementById('action-text');
const gridSelect=document.getElementById('grid-select');
const speedRange=document.getElementById('speed-range');
const wrapCheckbox=document.getElementById('wrap-checkbox');

let cols=15, rows=17;
let BASE_SPEED=.13, wallWrap=false;
let cellW=0, cellH=0, boardOffsetX=0, boardOffsetY=0;
let score=0;
let highscore=Number(localStorage.getItem('google_snake_highscore'))||0;
let gameRunning=false;
let snake=[];
let food={x:0,y:0};
let currentDir={x:1,y:0};
let nextDir={x:1,y:0};
let lastMoveTime=0;
let animationId=null;

const COLORS={edge:'#82ad42',bgLight:'#a2d149',bgDark:'#aad751',snakeHead:'#4e7cf6',snakeBody:'#5783f7',foodRed:'#e53935'};
highscoreVal.textContent=highscore;

gridSelect.innerHTML='<option value="big">Big Grid (12x14)</option><option value="normal" selected>Normal Grid (15x17)</option><option value="small">Small Grid (20x22)</option>';

function updateGrid(){
    const mode=gridSelect.value;
    if(mode==='big'){cols=12;rows=14}
    else if(mode==='small'){cols=20;rows=22}
    else {cols=15;rows=17}
    const cellSize=Math.min(canvas.width/cols,canvas.height/rows);
    cellW=cellSize;
    cellH=cellSize;
    boardOffsetX=(canvas.width-cols*cellSize)/2;
    boardOffsetY=(canvas.height-rows*cellSize)/2;
}

function updateSpeed(){BASE_SPEED=Number(speedRange.value)}

function spawnFood(){
    const open=[];
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
        if(!snake.some(p=>p.x===x&&p.y===y)) open.push({x,y});
    }
    if(!open.length){endGame('You Win!');return}
    food=open[Math.floor(Math.random()*open.length)];
}

function resetGame(){
    updateGrid(); updateSpeed(); wallWrap=wrapCheckbox.checked;
    score=0; scoreVal.textContent='0';
    const sx=Math.floor(cols/2), sy=Math.floor(rows/2);
    snake=[
        {x:sx,y:sy},
        {x:sx-1,y:sy},
        {x:sx-2,y:sy},
        {x:sx-3,y:sy}
    ];
    currentDir={x:1,y:0}; nextDir={x:1,y:0};
    spawnFood(); draw();
}

function startGame(){
    cancelAnimationFrame(animationId);
    resetGame();
    gameRunning=true;
    panelTitle.textContent='Snake Game';
    actionText.textContent='PLAY';
    menuScreen.classList.add('hidden');
    lastMoveTime=performance.now();
    animationId=requestAnimationFrame(gameLoop);
}

function endGame(title='Game Over'){
    gameRunning=false;
    cancelAnimationFrame(animationId);
    if(score>highscore){highscore=score;localStorage.setItem('google_snake_highscore',highscore);highscoreVal.textContent=highscore}
    panelTitle.textContent=title;
    actionText.textContent='PLAY AGAIN';
    menuScreen.classList.remove('hidden');
}

function isOpposite(a,b){return a.x+b.x===0&&a.y+b.y===0}
function setDirection(x,y){
    if(!gameRunning)return;
    const d={x,y};
    if(isOpposite(d,currentDir))return;
    nextDir=d;
}

window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if(k==='arrowup'||k==='w')setDirection(0,-1);
    else if(k==='arrowdown'||k==='s')setDirection(0,1);
    else if(k==='arrowleft'||k==='a')setDirection(-1,0);
    else if(k==='arrowright'||k==='d')setDirection(1,0);
    else if(k===' '&&!gameRunning)startGame();
});

let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:false});
canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    if(Math.abs(dx)>Math.abs(dy))setDirection(dx>0?1:-1,0);else setDirection(0,dy>0?1:-1);
},{passive:false});

actionBtn.addEventListener('click',startGame);
gridSelect.addEventListener('change',()=>{if(!gameRunning)resetGame()});
speedRange.addEventListener('input',updateSpeed);
wrapCheckbox.addEventListener('change',()=>{wallWrap=wrapCheckbox.checked});

function moveSnake(){
    currentDir={...nextDir};
    const head=snake[0];
    let newHead={x:head.x+currentDir.x,y:head.y+currentDir.y};
    if(wallWrap){
        if(newHead.x<0)newHead.x=cols-1;if(newHead.x>=cols)newHead.x=0;
        if(newHead.y<0)newHead.y=rows-1;if(newHead.y>=rows)newHead.y=0;
    }else if(newHead.x<0||newHead.x>=cols||newHead.y<0||newHead.y>=rows){endGame();return}

    const ate=newHead.x===food.x&&newHead.y===food.y;
    const body=ate?snake:snake.slice(0,-1);
    if(body.some(p=>p.x===newHead.x&&p.y===newHead.y)){endGame();return}
    snake.unshift(newHead);
    if(ate){
        score++;scoreVal.textContent=score;
        if(score>highscore){highscore=score;highscoreVal.textContent=highscore;localStorage.setItem('google_snake_highscore',highscore)}
        spawnFood();
    }else snake.pop();
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Distinct border around the playable map so the edges are easy to see.
    ctx.fillStyle=COLORS.edge;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Google-Snake-style checkerboard grid
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
        ctx.fillStyle=(x+y)%2===0?COLORS.bgLight:COLORS.bgDark;
        ctx.fillRect(boardOffsetX+x*cellW,boardOffsetY+y*cellH,Math.ceil(cellW)+1,Math.ceil(cellH)+1);
    }

    // Food
    ctx.fillStyle=COLORS.foodRed;
    ctx.beginPath();
    ctx.arc(boardOffsetX+food.x*cellW+cellW/2,boardOffsetY+food.y*cellH+cellH/2,Math.min(cellW,cellH)*.32,0,Math.PI*2);
    ctx.fill();

    // Discrete, cell-to-cell snake movement
    snake.forEach((p,i)=>{
        const pad=Math.min(cellW,cellH)*.07;
        ctx.fillStyle=i===0?COLORS.snakeHead:COLORS.snakeBody;
        ctx.fillRect(boardOffsetX+p.x*cellW+pad,boardOffsetY+p.y*cellH+pad,cellW-pad*2,cellH-pad*2);
        if(i===0)drawEyes(p.x,p.y);
    });
}

function drawEyes(x,y){
    const cx=boardOffsetX+x*cellW+cellW/2,cy=boardOffsetY+y*cellH+cellH/2;
    const size=Math.min(cellW,cellH)*.075,ox=cellW*.19,oy=cellH*.22;
    let a={x:cx-ox,y:cy-oy},b={x:cx+ox,y:cy-oy};
    if(currentDir.x===1){a={x:cx+ox,y:cy-oy};b={x:cx+ox,y:cy+oy}}
    else if(currentDir.x===-1){a={x:cx-ox,y:cy-oy};b={x:cx-ox,y:cy+oy}}
    else if(currentDir.y===1){a={x:cx-ox,y:cy+oy};b={x:cx+ox,y:cy+oy}}
    ctx.fillStyle='#fff';[a,b].forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,size,0,Math.PI*2);ctx.fill()});
    ctx.fillStyle='#222';[a,b].forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,size*.45,0,Math.PI*2);ctx.fill()});
}

function gameLoop(t){
    if(!gameRunning)return;

    // Deliberate grid-step movement instead of interpolation.
    const delay=Math.max(80,260-BASE_SPEED*700);
    if(t-lastMoveTime>=delay){
        moveSnake();
        lastMoveTime=t;
    }

    draw();
    animationId=requestAnimationFrame(gameLoop);
}

resetGame();
</script>
</body>
</html>
