<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Snake Replica with Swipe Controls</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            touch-action: none; /* Prevents mobile browsers from scrolling or zooming while playing */
        }
        body {
            background: #4a752c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-radius: 10px;
            overflow: hidden;
            background: #578a34;
        }
        #top-banner {
            background: #4a752c;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            border-bottom: 4px solid #3d6124;
        }
        .stat-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
        }
        #canvas-container {
            position: relative;
            width: 600px;
            max-width: 95vw;
            height: 420px;
        }
        canvas {
            display: block;
            background: #a2d149;
            width: 100%;
            height: 100%;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.2s ease;
        }
        .overlay-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .menu-card {
            background: #4d732c;
            border: 8px solid #5c8a35;
            border-radius: 18px;
            padding: 25px 40px;
            width: 420px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #34511e;
        }
        .settings-box {
            width: 100%;
            background: #3e5c23;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #5c8a35;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
        }
        .setting-item:last-child {
            margin-bottom: 0;
        }
        .setting-item label {
            color: #e3ffe3;
        }
        .setting-item select, .setting-item input[type="range"] {
            background: #5c8a35;
            border: 2px solid #71aa41;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            width: 150px;
        }
        .setting-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #a2d149;
            cursor: pointer;
        }
        .primary-btn {
            background: #1e88e5;
            color: white;
            border: none;
            border-bottom: 4px solid #1565c0;
            padding: 12px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .primary-btn:hover {
            background: #2196f3;
        }
        .primary-btn:active {
            transform: scale(0.97);
            border-bottom-width: 2px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="top-banner">
            <div class="stat-indicator">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="#e53935"><path d="M12 2C11.38 2 10.19 2.62 9.13 3.5C7.26 5.09 6.5 7.55 6.5 10c0 4.14 3.08 7.5 7 7.5s7-3.36 7-7.5c0-2.45-.76-4.91-2.63-6.5C16.81 2.62 15.62 2 15 2c-.62 0-1.5.5-3 1.5C10.5 2.5 9.62 2 12 2zm1 14.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-1.38-1.12-2.5-2.5-2.5-.28 0-.5-.22-.5-.5s.22-.5.5-.5c1.93 0 3.5 1.57 3.5 3.5z"/><path d="M12 2c.5 0 1 .5 1 1v1c0 .5-.5 1-1 1s-1-.5-1-1V3c0-.5.5-1 1-1z" fill="#7cb342"/></svg>
                <span id="score-val">0</span>
            </div>
            <div class="stat-indicator">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="#fdd835"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v3c0 2.44 1.72 4.44 4 4.88V18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2v-3.12c2.28-.44 4-2.44 4-4.88V7c0-1.1-.9-2-2-2zm-12 5H5V7h2v3zm12 0h-2V7h2v3z"/></svg>
                <span id="highscore-val">0</span>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="snakeCanvas" width="600" height="420"></canvas>
            
            <div id="menu-screen" class="overlay-screen">
                <div class="menu-card">
                    <div id="panel-title" class="menu-title">Snake Game</div>
                    
                    <div class="settings-box">
                        <div class="setting-item">
                            <label for="grid-select">Map Density</label>
                            <select id="grid-select">
                                <option value="30">Big Grid (14x20)</option>
                                <option value="20" selected>Normal Grid (21x30)</option>
                                <option value="15">Small Grid (28x40)</option>
                            </select>
                        </div>
                        
                        <div class="setting-item">
                            <label for="speed-range">Snake Speed</label>
                            <input type="range" id="speed-range" min="0.07" max="0.25" step="0.03" value="0.13">
                        </div>

                        <div class="setting-item">
                            <label for="wrap-checkbox">Wall Wrap-around</label>
                            <input type="checkbox" id="wrap-checkbox">
                        </div>
                    </div>

                    <button id="action-btn" class="primary-btn">PLAY</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const highscoreVal = document.getElementById('highscore-val');
        const menuScreen = document.getElementById('menu-screen');
        const panelTitle = document.getElementById('panel-title');
        const actionBtn = document.getElementById('action-btn');

        const gridSelect = document.getElementById('grid-select');
        const speedRange = document.getElementById('speed-range');
        const wrapCheckbox = document.getElementById('wrap-checkbox');

        let GRID_SIZE = 20;
        let BASE_SPEED = 0.13;
        let wallWrap = false;

        let score = 0;
        let highscore = localStorage.getItem('google_snake_highscore') || 0;
        highscoreVal.textContent = highscore;

        let gameRunning = false;
        let snake = [];
        let food = { x: 0, y: 0 };
        
        let currentDir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };
        let moveProgress = 0;
        let frameVelocity = BASE_SPEED;

        const COLORS = {
            bgLight: '#a2d149',
            bgDark: '#aad751',
            snakeHead: '#4e7cf6',
            snakeBody: '#5783f7',
            foodRed: '#e53935'
        };

        // 1. Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if(["space", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
            if(!gameRunning) return;

            switch(e.key.toLowerCase()) {
                case 'arrowup': case 'w':
                    if (currentDir.y === 0) nextDir = { x: 0, y: -1 }; break;
                case 'arrowdown': case 's':
                    if (currentDir.y === 0) nextDir = { x: 0, y: 1 }; break;
                case 'arrowleft': case 'a':
                    if (currentDir.x === 0) nextDir = { x: -1, y: 0 }; break;
                case 'arrowright': case 'd':
                    if (currentDir.x === 0) nextDir = { x: 1, y: 0 }; break;
            }
        });

        // 2. Touch Screen Swiping Handling
        let touchStartX = 0;
        let touchStartY = 0;
        const SWIPE_THRESHOLD = 30; // Min drag pixels to calculate as a deliberate swipe direction

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('toumove', (e) => {
            // Actively block screen bouncing/scrolling during tracking movement
            if (e.cancelable) e.preventDefault(); 
        }, { passive: false });
