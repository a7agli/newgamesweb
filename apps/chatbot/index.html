<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Chat Pro</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
:root{
    --bg:#000;
    --panel:#0b0b0b;
    --border:rgba(255,255,255,0.08);
    --text:#eaeaea;
    --muted:#9aa0a6;
    --accent:#fff;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:system-ui;
    background:var(--bg);
    color:var(--text);
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:270px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.sideHeader{
    padding:14px;
    font-weight:700;
    border-bottom:1px solid var(--border);
}

.newChat{
    margin:10px;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
}

.chatList{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.chatItem{
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
    cursor:pointer;
    font-size:13px;
}

.chatItem:hover{
    border-color:#fff;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    padding:12px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    font-weight:600;
}

.chat{
    flex:1;
    padding:14px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    max-width:75%;
    padding:10px 14px;
    border-radius:14px;
    font-size:14px;
    white-space:pre-wrap;
    border:1px solid var(--border);
    position:relative;
}

.user{
    align-self:flex-end;
    background:#111;
}

.ai{
    align-self:flex-start;
    background:#0d0d0d;
}

/* actions */
.actions{
    position:absolute;
    top:4px;
    right:6px;
    display:none;
    gap:5px;
}

.msg:hover .actions{
    display:flex;
}

.actions button{
    background:none;
    border:none;
    color:#aaa;
    cursor:pointer;
    font-size:12px;
}

.actions button:hover{
    color:#fff;
}

/* input */
.inputBar{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--panel);
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#000;
    color:var(--text);
}

button{
    width:44px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
    cursor:pointer;
}

/* markdown */
code{
    display:block;
    background:#111;
    padding:8px;
    border-radius:8px;
    margin-top:6px;
    color:#0f0;
    overflow-x:auto;
}

.bold{
    font-weight:700;
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="sideHeader">Chats</div>
    <button class="newChat" onclick="newChat()">+ New Chat</button>
    <div id="chatList" class="chatList"></div>
</div>

<div class="main">
    <div class="header">AI Assistant</div>
    <div id="chat" class="chat"></div>

    <div class="inputBar">
        <input id="input" placeholder="Message..." />
        <button onclick="send()"><span class="material-icons">send</span></button>
    </div>
</div>

<script>
let chats=[];
let current=null;
let count=0;

const chatBox=document.getElementById("chat");
const list=document.getElementById("chatList");
const input=document.getElementById("input");

/* CHAT */
function newChat(){
    count++;
    const c={id:count,messages:[]};
    chats.push(c);
    current=c;
    renderList();
    render();
}

function renderList(){
    list.innerHTML="";
    chats.forEach(c=>{
        const d=document.createElement("div");
        d.className="chatItem";
        d.textContent="Chat "+c.id;
        d.onclick=()=>{current=c;render();};
        list.appendChild(d);
    });
}

/* RENDER MESSAGES */
function render(){
    chatBox.innerHTML="";
    if(!current)return;

    current.messages.forEach((m,i)=>{
        draw(m.text,m.role,i);
    });
}

function format(text){
    return text
        .replace(/```([\s\S]*?)```/g,"<code>$1</code>")
        .replace(/\*\*(.*?)\*\*/g,"<span class='bold'>$1</span>");
}

/* MESSAGE */
function draw(text,role,index){
    const d=document.createElement("div");
    d.className="msg "+role;
    d.innerHTML=format(text);

    const actions=document.createElement("div");
    actions.className="actions";

    const del=document.createElement("button");
    del.textContent="del";
    del.onclick=()=>{
        current.messages.splice(index,1);
        render();
    };

    const edit=document.createElement("button");
    edit.textContent="edit";
    edit.onclick=()=>{
        const nv=prompt("Edit:",text);
        if(nv){
            current.messages[index].text=nv;
            render();
        }
    };

    actions.appendChild(edit);
    actions.appendChild(del);
    d.appendChild(actions);

    chatBox.appendChild(d);
    chatBox.scrollTop=chatBox.scrollHeight;
}

/* STREAM */
async function stream(text){
    const d=document.createElement("div");
    d.className="msg ai";
    chatBox.appendChild(d);

    let i=0;
    return new Promise(res=>{
        const t=setInterval(()=>{
            d.innerHTML=format(text.slice(0,i));
            i++;
            chatBox.scrollTop=chatBox.scrollHeight;
            if(i>text.length){
                clearInterval(t);
                res();
            }
        },10);
    });
}

/* API */
async function api(p){
    const r=await fetch("https://backend.buildpicoapps.com/aero/run/llm-api?pk=v1-Z0FBQUFBQm5HUEtMSjJkakVjcF9IQ0M0VFhRQ0FmSnNDSHNYTlJSblE0UXo1Q3RBcjFPcl9YYy1OZUhteDZWekxHdWRLM1M1alNZTkJMWEhNOWd4S1NPSDBTWC12M0U2UGc9PQ==",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt:p})
    });
    return r.json();
}

/* SEND */
async function send(){
    const t=input.value.trim();
    if(!t||!current)return;

    current.messages.push({role:"user",text:t});
    draw(t,"user",current.messages.length-1);

    input.value="";

    const res=await api(t);

    if(res.status==="success"){
        current.messages.push({role:"ai",text:res.text});
        await stream(res.text);
    }
}

/* ENTER */
input.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* INIT */
newChat();
</script>

</body>
</html>
