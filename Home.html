<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frazer</title>
<link rel="stylesheet" href="/main.css">
<link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.2.0/css/all.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg:           #0a0a0a;
    --bg-nav:       #111;
    --bg-card:      #181818;
    --bg-input:     #151515;
    --bg-btn:       #1e1e1e;
    --bg-setting:   #141414;
    --border:       #1e1e1e;
    --border-input: #2a2a2a;
    --text:         #ffffff;
    --text-muted:   #bbb;
    --text-dim:     #777;
    --text-faint:   #555;
    --accent:       #5b8fff;
    --toggle-bg:    #2a2a2a;
    --toggle-knob:  #666;
  }

  [data-theme="light"] {
    --bg:           #f4f4f4;
    --bg-nav:       #ffffff;
    --bg-card:      #ffffff;
    --bg-input:     #f0f0f0;
    --bg-btn:       #e8e8e8;
    --bg-setting:   #f9f9f9;
    --border:       #e0e0e0;
    --border-input: #d0d0d0;
    --text:         #111111;
    --text-muted:   #444;
    --text-dim:     #666;
    --text-faint:   #999;
    --toggle-bg:    #ddd;
    --toggle-knob:  #aaa;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    background: var(--bg-nav);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background 0.25s, border-color 0.25s;
  }

  nav img { height: 34px; border-radius: 8px; }

  nav h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.5px;
    flex: 1;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-input);
    background: var(--bg-btn);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    transition: color 0.15s;
    user-select: none;
  }

  .theme-toggle:hover { color: var(--text); }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    background: var(--bg-nav);
    border-bottom: 1px solid var(--border);
    transition: background 0.25s, border-color 0.25s;
  }

  .tab-btn {
    padding: 12px 18px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 0.3px;
  }

  .tab-btn:hover { color: var(--text-muted); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-panel { display: none; padding: 28px 24px; }
  .tab-panel.active { display: block; }

  .section { margin-bottom: 36px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .section-header h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }

  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    margin-left: 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    overflow: visible;
  }

  .card {
    position: relative;
    display: block;
    background: none;
    border: none;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform;
  }

  .card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .card:hover {
    transform: scale(1.07) translateY(-4px);
    z-index: 2;
  }

  .card:hover .card-inner {
    box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 1px #5b8fff33;
  }

  .card:hover img { transform: scale(1.04); }

  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.18s;
  }

  .card:hover .play-overlay { opacity: 1; }

  .play-overlay i {
    font-size: 22px;
    color: #fff;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }

  .card { overflow: visible; }
  .card-inner {
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }
  .card:hover .card-inner { border-color: #5b8fff55; }

  .card-label {
    padding: 5px 2px 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    transition: color 0.2s;
  }
  .card:hover .card-label { color: var(--text); }

  @keyframes shimmer {
    0%   { background-position: -400px 0; }
    100% { background-position:  400px 0; }
  }

  .skeleton {
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
  }

  .skeleton-thumb {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(90deg, var(--border) 25%, var(--bg-btn) 50%, var(--border) 75%);
    background-size: 400px 100%;
    animation: shimmer 1.4s infinite linear;
  }

  .skeleton-label {
    height: 11px;
    margin: 7px auto 5px;
    width: 65%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--border) 25%, var(--bg-btn) 50%, var(--border) 75%);
    background-size: 400px 100%;
    animation: shimmer 1.4s infinite linear;
    animation-delay: 0.1s;
  }

  .search-bar { display: flex; gap: 8px; margin-bottom: 18px; }

  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border-input);
    color: var(--text);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text-faint); }

  .search-bar button {
    padding: 10px 16px;
    background: var(--bg-btn);
    border: 1px solid var(--border-input);
    color: var(--text-muted);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: color 0.15s;
  }

  .search-bar button:hover { color: var(--text); }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 12px;
    text-align: center;
  }

  .empty-state i { font-size: 40px; color: var(--border-input); }
  .empty-state p { margin: 0; font-size: 15px; color: var(--text-faint); }

  .settings-grid { display: flex; flex-direction: column; gap: 10px; max-width: 600px; }

  .settings-group {
    background: var(--bg-setting);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: background 0.25s, border-color 0.25s;
  }

  .settings-group-label {
    padding: 10px 16px 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-faint);
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    gap: 16px;
    transition: border-color 0.25s;
  }

  .settings-group .setting-row:first-of-type { border-top: none; }

  .setting-info { flex: 1; }
  .setting-info .label { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .setting-info .desc { font-size: 12px; color: var(--text-faint); }

  .toggle-wrap { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--toggle-bg);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: transform 0.2s, background 0.2s;
  }

  .toggle-wrap input:checked + .toggle-track { background: var(--accent); }
  .toggle-wrap input:checked + .toggle-track::after { transform: translateX(18px); background: #fff; }

  .setting-select {
    padding: 7px 10px;
    background: var(--bg-btn);
    border: 1px solid var(--border-input);
    color: var(--text);
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  .setting-select:focus { border-color: var(--accent); }

  .reset-btn {
    padding: 7px 14px;
    background: var(--bg-btn);
    border: 1px solid var(--border-input);
    color: var(--text-muted);
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    transition: color 0.15s;
  }

  .reset-btn:hover { color: var(--text); }
</style>
</head>
<body>

<nav>
  <img src="images/image_1884.jpeg" alt="Frazer logo">
  <h1>Frazer</h1>
  <button class="theme-toggle" onclick="toggleTheme()">
    <i id="themeIcon" class="fa-solid fa-moon"></i>
    <span id="themeLabel">Dark</span>
  </button>
</nav>
