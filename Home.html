<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frazer OS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  overflow:hidden;
  background:url("https://www.wallpaperhub.app/_next/image?url=https%3A%2F%2Fcdn.wallpaperhub.app%2Fcloudcache%2F8%2Fe%2Fc%2F4%2F4%2Ff%2F8ec44f86876a912a93f4116f50e6a3839af5c03b.jpg&w=4096&h=2160&q=100") center/cover no-repeat;
}

/* TASKBAR */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:50px;
  background:rgba(20,20,20,0.7);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.start-btn{
  width:44px;height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  cursor:pointer;
}

/* START MENU */
#start-menu{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%) scale(0.95);
  width:600px;
  height:680px;
  background:rgba(25,25,25,0.85);
  backdrop-filter:blur(20px);
  border-radius:16px;
  padding:16px;
  display:none;
  color:white;
  opacity:0;
  transition:0.25s;
}
#start-menu.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

/* SEARCH */
.search{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
  margin-bottom:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

/* TILE */
.tile{
  background:rgba(255,255,255,0.08);
  border-radius:12px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.tile:hover{transform:scale(1.05); background:rgba(255,255,255,0.15);}
.tile img{width:42px;height:42px;}
.tile i{font-size:28px;}

/* PANELS */
.panel{display:none;}
.panel.active{display:block;}

/* BIG GRID */
.big-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:10px;
}

/* CLICKABLE APPS FIX */
.small-tile{
  background:rgba(255,255,255,0.08);
  border-radius:12px;
  padding:8px;
  text-align:center;
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
}
.small-tile:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.18);
}

/* FOOTER */
.footer{
  position:absolute;
  bottom:14px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-between;
  border-top:1px solid rgba(255,255,255,0.1);
  padding-top:10px;
}

.user{display:flex;gap:8px;align-items:center;}
.avatar{
  width:32px;height:32px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
}

.power{
  width:36px;height:36px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.1);
  cursor:pointer;
}
</style>
</head>

<body>

<!-- START MENU -->
<div id="start-menu">

<input class="search" placeholder="Search For Apps, Settings, Etc">

<!-- HOME -->
<div id="home-panel" class="panel active">

  <div class="grid">

    <div class="tile" onclick="openPanel('games')">
      <img src="https://www.image2url.com/r2/default/images/1778347690257-4f700930-6b2c-434a-82c6-90a81ab67074.png">
      <div>Games</div>
    </div>

    <div class="tile" onclick="openPanel('apps')">
      <img src="https://www.image2url.com/r2/default/images/1778347690257-4f700930-6b2c-434a-82c6-90a81ab67074.png">
      <div>Apps</div>
    </div>

    <div class="tile" onclick="openPanel('settings')">
      <i class="fa fa-gear"></i>
      <div>Settings</div>
    </div>

  </div>
</div>

<!-- GAMES -->
<div id="games-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>

  <div class="big-grid">

    <div class="small-tile" onclick="openGame('games/vex7/')">Vex 7</div>
    <div class="small-tile" onclick="openGame('games/vex6/')">Vex 6</div>
    <div class="small-tile" onclick="openGame('games/slope/')">Slope</div>
    <div class="small-tile" onclick="openGame('games/drive-mad/')">Drive Mad</div>
    <div class="small-tile" onclick="openGame('games/retro-bowl/')">Retro Bowl</div>
    <div class="small-tile" onclick="openGame('games/gball/')">GBall</div>
    <div class="small-tile" onclick="openGame('games/moto-x3m/')">Moto X3M</div>
    <div class="small-tile" onclick="openGame('games/motox3m2/')">Moto X3M 2</div>
    <div class="small-tile" onclick="openGame('games/Basketball stars/')">Basketball Stars</div>
    <div class="small-tile" onclick="openGame('games/Snow-Rider3D-main/')">Snow Rider 3D</div>
    <div class="small-tile" onclick="openGame('games/fnaf/')">FNaF</div>
    <div class="small-tile" onclick="openGame('games/fnaje/')">FNaJE</div>
    <div class="small-tile" onclick="opengame('games/rocket-goal/')">Rocket Goal</div>

  </div>
</div>

<!-- APPS -->
<div id="apps-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>

  <div class="big-grid">

    <div class="small-tile" onclick="openGame('apps/chatbot/')">Chatbot</div>
    <div class="small-tile" onclick="alert('Coming soon!')">Browser</div>
    <div class="small-tile" onclick="alert('Coming soon!')">Files</div>
    <div class="small-tile" onclick="alert('Coming soon!')">Music</div>

  </div>
</div>

<!-- SETTINGS -->
<div id="settings-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>
  <p>⚙ Settings App</p>
</div>

<!-- FOOTER -->
<div class="footer">

  <div class="user">
    <div class="avatar"><i class="fa fa-user"></i></div>
    <div>Frazer User</div>
  </div>

  <div class="power" onclick="window.location='https://classroom.google.com'">
    <i class="fa fa-power-off"></i>
  </div>

</div>

</div>

<!-- TASKBAR -->
<div class="taskbar">
  <div class="start-btn" onclick="toggleMenu()">
    <i class="fa-brands fa-windows"></i>
  </div>
</div>

<script>
function toggleMenu(){
  const m=document.getElementById("start-menu");
  if(m.classList.contains("show")){
    m.classList.remove("show");
    setTimeout(()=>m.style.display="none",200);
  }else{
    m.style.display="block";
    setTimeout(()=>m.classList.add("show"),10);
  }
}

function openPanel(name){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(name+"-panel").classList.add("active");
}

/* ✅ FIX: REAL GAME OPENING */
function openGame(url){
  window.location.href = url;
}
</script>

</body>
</html>
