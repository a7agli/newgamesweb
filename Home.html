<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frazer OS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  overflow:hidden;
  background:url("https://www.wallpaperhub.app/_next/image?url=https%3A%2F%2Fcdn.wallpaperhub.app%2Fcloudcache%2F8%2Fe%2Fc%2F4%2F4%2Ff%2F8ec44f86876a912a93f4116f50e6a3839af5c03b.jpg&w=4096&h=2160&q=100") center/cover no-repeat;
}

/* TASKBAR */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:50px;
  background:rgba(20,20,20,0.7);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.start-btn{
  width:44px;height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  cursor:pointer;
}

/* START MENU */
#start-menu{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%) scale(0.95);
  width:600px;
  height:680px;
  background:rgba(25,25,25,0.85);
  backdrop-filter:blur(20px);
  border-radius:16px;
  padding:16px;
  display:none;
  color:white;
  opacity:0;
  transition:0.25s;
  z-index:9998;
}
#start-menu.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

.search{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.tile{
  background:rgba(255,255,255,0.08);
  border-radius:12px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.tile:hover{transform:scale(1.05);background:rgba(255,255,255,0.15);}

.big-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:10px;
}

.small-tile{
  background:rgba(255,255,255,0.08);
  border-radius:12px;
  padding:8px;
  text-align:center;
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
}
.small-tile:hover{transform:scale(1.05);background:rgba(255,255,255,0.18);}

.panel{display:none;}
.panel.active{display:block;}

/* WINDOWS SYSTEM */
#window-area{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.window{
  position:absolute;
  width:850px;
  height:520px;
  background:#1e1e1e;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  pointer-events:auto;

  display:flex;
  flex-direction:column;

  resize:both;
  min-width:300px;
  min-height:200px;
}

.window-header{
  height:40px;
  flex-shrink:0;
  background:rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  cursor:move;
  color:white;
}

.win-controls{display:flex;gap:6px;}

.win-btn{
  width:14px;height:14px;border-radius:3px;cursor:pointer;
}
.close{background:#ff5f57;}
.max{background:#ffbd2e;}

.window.maximized{
  top:0 !important;
  left:0 !important;
  width:100% !important;
  height:calc(100% - 50px) !important;
  border-radius:0 !important;
}

.window iframe{
  flex:1;
  width:100%;
  border:none;
  display:block;
}
</style>
</head>

<body>

<div id="window-area"></div>

<!-- START MENU -->
<div id="start-menu">

<input class="search" placeholder="Search For Apps, Settings, Etc">

<div id="home-panel" class="panel active">
  <div class="grid">

    <div class="tile" onclick="openPanel('games')">
      <img src="https://www.image2url.com/r2/default/images/1778347690257-4f700930-6b2c-434a-82c6-90a81ab67074.png" width="40">
      <div>Games</div>
    </div>

    <div class="tile" onclick="openPanel('apps')">
      <img src="https://www.image2url.com/r2/default/images/1778347690257-4f700930-6b2c-434a-82c6-90a81ab67074.png" width="40">
      <div>Apps</div>
    </div>

    <div class="tile" onclick="openPanel('settings')">
      <i class="fa fa-gear"></i>
      <div>Settings</div>
    </div>

  </div>
</div>

<!-- GAMES -->
<div id="games-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>

  <div class="big-grid">
    <div class="small-tile" onclick="openApp('games/vex7/index.html','Vex 7')">Vex 7</div>
    <div class="small-tile" onclick="openApp('games/vex6/index.html','Vex 6')">Vex 6</div>
    <div class="small-tile" onclick="openApp('games/slope/index.html','Slope')">Slope</div>
    <div class="small-tile" onclick="openApp('games/drive-mad/index.html','Drive Mad')">Drive Mad</div>
    <div class="small-tile" onclick="openApp('games/retro-bowl/index.html','Retro Bowl')">Retro Bowl</div>
    <div class="small-tile" onclick="openApp('games/gball/index.html','GBall')">GBall</div>
    <div class="small-tile" onclick="openApp('games/moto-x3m/index.html','Moto X3M')">Moto X3M</div>
    <div class="small-tile" onclick="openApp('games/motox3m2/index.html','Moto X3M 2')">Moto X3M 2</div>
    <div class="small-tile" onclick="openApp('games/basketball-stars/index.html','Basketball Stars')">Basketball Stars</div>
    <div class="small-tile" onclick="openApp('games/snow-rider/index.html','Snow Rider 3D')">Snow Rider 3D</div>
    <div class="small-tile" onclick="openApp('games/fnaf/index.html','FNaF')">FNaF</div>
    <div class="small-tile" onclick="openApp('games/fnaje/index.html','FNaJE')">FNaJE</div>
    <div class="small-tile" onclick="openApp('games/rocket-goal/index.html','Rocket Goal')">Rocket Goal</div>
  </div>
</div>

<!-- APPS -->
<div id="apps-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>

<div class="big-grid">
  <div class="small-tile" onclick="openApp('apps/chatbot/index.html','Chatbot')">AI Chatbot</div>
  <div class="small-tile" onclick="alert('Browser coming soon')">Browser</div>
  <div class="small-tile" onclick="alert('Files coming soon')">Files</div>
  <div class="small-tile" onclick="openApp('apps/music/index.html','Frazer Music')">Frazer Music</div>
</div>
</div>

</div>

<!-- TASKBAR -->
<div class="taskbar">
  <div class="start-btn" onclick="toggleMenu()">
    <i class="fa-brands fa-windows"></i>
  </div>
</div>

<script>
let z=2000;
let windows=[];

/* MENU */
function toggleMenu(){
  const m=document.getElementById("start-menu");
  if(m.classList.contains("show")){
    m.classList.remove("show");
    setTimeout(()=>m.style.display="none",200);
  }else{
    m.style.display="block";
    setTimeout(()=>m.classList.add("show"),10);
  }
}

/* PANELS */
function openPanel(name){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(name+"-panel").classList.add("active");
}

/* OPEN APP */
function openApp(url,title){
  const win=document.createElement("div");
  win.className="window";
  win.style.top=(80+windows.length*20)+"px";
  win.style.left=(80+windows.length*20)+"px";
  win.style.zIndex=z++;

  win.innerHTML=`
    <div class="window-header">
      <span>${title}</span>

      <div class="win-controls">
        <div class="win-btn max" onclick="toggleMax(this)"></div>
        <div class="win-btn close" onclick="this.closest('.window').remove()"></div>
      </div>
    </div>
    <iframe src="${url}"></iframe>
  `;

  document.getElementById("window-area").appendChild(win);
  windows.push(win);
  drag(win);

  win.addEventListener("mousedown",()=>win.style.zIndex=z++);
}

/* MUSIC APP */
function openMusic(){
  const win=document.createElement("div");
  win.className="window";
  win.style.top="120px";
  win.style.left="120px";
  win.style.zIndex=z++;

  win.innerHTML=`
    <div class="window-header">
      <span>Frazer Music</span>

      <div class="win-controls">
        <div class="win-btn max" onclick="toggleMax(this)"></div>
        <div class="win-btn close" onclick="this.closest('.window').remove()"></div>
      </div>
    </div>

    <div style="padding:10px;color:white;display:flex;flex-direction:column;gap:10px;">
      <h3>🎵 Music Player</h3>

      <audio controls style="width:100%">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
      </audio>

      <audio controls style="width:100%">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
      </audio>

      <audio controls style="width:100%">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
      </audio>
    </div>
  `;

  document.getElementById("window-area").appendChild(win);
  windows.push(win);
  drag(win);

  win.addEventListener("mousedown",()=>win.style.zIndex=z++);
}

/* MAXIMIZE */
function toggleMax(btn){
  btn.closest(".window").classList.toggle("maximized");
}

/* DRAG */
function drag(el){
  const h=el.querySelector(".window-header");
  let dx,dy,drag=false;

  h.onmousedown=(e)=>{
    drag=true;
    dx=e.clientX-el.offsetLeft;
    dy=e.clientY-el.offsetTop;
    el.style.zIndex=z++;
  };

  document.onmousemove=(e)=>{
    if(!drag)return;
    el.style.left=(e.clientX-dx)+"px";
    el.style.top=(e.clientY-dy)+"px";
  };

  document.onmouseup=()=>drag=false;
}
</script>

</body>
</html>
