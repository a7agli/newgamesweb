<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frazer OS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  overflow:hidden;
  background:url("https://www.wallpaperhub.app/_next/image?url=https%3A%2F%2Fcdn.wallpaperhub.app%2Fcloudcache%2F8%2Fe%2Fc%2F4%2F4%2Ff%2F8ec44f86876a912a93f4116f50e6a3839af5c03b.jpg&w=4096&h=2160&q=100") center/cover no-repeat;
}

/* TASKBAR */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:50px;
  background:rgba(20,20,20,0.7);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.start-btn{
  width:44px;height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  cursor:pointer;
}

/* START MENU (UNCHANGED STYLE) */
#start-menu{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%) scale(0.95);
  width:600px;
  height:680px;
  background:rgba(25,25,25,0.85);
  backdrop-filter:blur(20px);
  border-radius:16px;
  padding:16px;
  display:none;
  color:white;
  opacity:0;
  transition:0.25s;
  z-index:9998;
}
#start-menu.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

.search{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.tile{
  background:rgba(255,255,255,0.08);
  border-radius:12px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.tile:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.15);
}

.big-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:10px;
}

.small-tile{
  background:rgba(255,255,255,0.08);
  border-radius:12px;
  padding:8px;
  text-align:center;
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
}
.small-tile:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.18);
}

.panel{display:none;}
.panel.active{display:block;}

/* WINDOWS SYSTEM */
#window-area{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.window{
  position:absolute;
  width:850px;
  height:520px;
  background:#1e1e1e;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  pointer-events:auto;
}

.window-header{
  height:40px;
  background:rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  cursor:move;
  color:white;
}

.window iframe{
  width:100%;
  height:calc(100% - 40px);
  border:none;
  background:black;
}
</style>
</head>

<body>

<!-- WINDOWS -->
<div id="window-area"></div>

<!-- START MENU (UNCHANGED CONTENT STRUCTURE) -->
<div id="start-menu">

<input class="search" placeholder="Search For Apps, Settings, Etc">

<!-- HOME -->
<div id="home-panel" class="panel active">

  <div class="grid">

    <div class="tile" onclick="openPanel('games')">
      <img src="https://www.image2url.com/r2/default/images/1778347690257-4f700930-6b2c-434a-82c6-90a81ab67074.png" width="40">
      <div>Games</div>
    </div>

    <div class="tile" onclick="openPanel('apps')">
      <img src="https://www.image2url.com/r2/default/images/1778347690257-4f700930-6b2c-434a-82c6-90a81ab67074.png" width="40">
      <div>Apps</div>
    </div>

    <div class="tile" onclick="openPanel('settings')">
      <i class="fa fa-gear"></i>
      <div>Settings</div>
    </div>

  </div>
</div>

<!-- GAMES (ORIGINAL LIST RESTORED) -->
<div id="games-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>

  <div class="big-grid">
    <div class="small-tile" onclick="openGame('games/vex7/index.html','Vex 7')">Vex 7</div>
    <div class="small-tile" onclick="openGame('games/vex6/index.html','Vex 6')">Vex 6</div>
    <div class="small-tile" onclick="openGame('games/slope/index.html','Slope')">Slope</div>
    <div class="small-tile" onclick="openGame('games/drive-mad/index.html','Drive Mad')">Drive Mad</div>
    <div class="small-tile" onclick="openGame('games/retro-bowl/index.html','Retro Bowl')">Retro Bowl</div>
    <div class="small-tile" onclick="openGame('games/gball/index.html','GBall')">GBall</div>
    <div class="small-tile" onclick="openGame('games/moto-x3m/index.html','Moto X3M')">Moto X3M</div>
    <div class="small-tile" onclick="openGame('games/motox3m2/index.html','Moto X3M 2')">Moto X3M 2</div>
    <div class="small-tile" onclick="openGame('games/Basketball stars/index.html','Basketball Stars')">Basketball Stars</div>
    <div class="small-tile" onclick="openGame('games/Snow-Rider3D-main/index.html','Snow Rider 3D')">Snow Rider 3D</div>
    <div class="small-tile" onclick="openGame('games/fnaf/index.html','FNaF')">FNaF</div>
    <div class="small-tile" onclick="openGame('games/fnaje/index.html','FNaJE')">FNaJE</div>
    <div class="small-tile" onclick="openGame('games/rocket-goal/index.html','Rocket Goal')">Rocket Goal</div>
  </div>
</div>

<!-- APPS -->
<div id="apps-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>

  <div class="big-grid">
    <div class="small-tile" onclick="openGame('apps/chatbot/index.html','Chatbot')">Chatbot</div>
    <div class="small-tile" onclick="alert('Coming soon')">Browser</div>
    <div class="small-tile" onclick="alert('Coming soon')">Files</div>
    <div class="small-tile" onclick="alert('Coming soon')">Music</div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-panel" class="panel">
  <div class="tile" onclick="openPanel('home')">⬅ Back</div>
</div>

</div>

<!-- TASKBAR -->
<div class="taskbar">
  <div class="start-btn" onclick="toggleMenu()">
    <i class="fa-brands fa-windows"></i>
  </div>
</div>

<script>
let z = 2000;

/* START MENU */
function toggleMenu(){
  const m=document.getElementById("start-menu");
  if(m.classList.contains("show")){
    m.classList.remove("show");
    setTimeout(()=>m.style.display="none",200);
  }else{
    m.style.display="block";
    setTimeout(()=>m.classList.add("show"),10);
  }
}

/* PANEL SWITCH */
function openPanel(name){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(name+"-panel").classList.add("active");
}

/* WINDOWS LAUNCHER (FIXED) */
function openGame(url,title){
  const win=document.createElement("div");
  win.className="window";
  win.style.top="80px";
  win.style.left="80px";
  win.style.zIndex=z++;

  win.innerHTML=`
    <div class="window-header">
      <span>${title}</span>
      <button onclick="this.closest('.window').remove()"
      style="background:none;border:none;color:white;font-size:16px;">✕</button>
    </div>
    <iframe src="${url}"></iframe>
  `;

  document.getElementById("window-area").appendChild(win);
  drag(win);
}

/* DRAG SYSTEM */
function drag(el){
  const h=el.querySelector(".window-header");
  let dx,dy,drag=false;

  h.onmousedown=(e)=>{
    drag=true;
    dx=e.clientX-el.offsetLeft;
    dy=e.clientY-el.offsetTop;
    el.style.zIndex=z++;
  };

  document.onmousemove=(e)=>{
    if(!drag)return;
    el.style.left=(e.clientX-dx)+"px";
    el.style.top=(e.clientY-dy)+"px";
  };

  document.onmouseup=()=>drag=false;
}
</script>

</body>
</html>
